<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Alerts</title>
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="main.js"></script>
  </head>
  <body>
    <div id="alert" data-layout="image-above">
