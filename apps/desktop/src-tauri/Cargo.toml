[package]
name = "overly-desktop"
version = "0.0.0"
description = "Overly desktop shell: tray icon and Node sidecar lifecycle"
license = "MIT"
repository = "https://github.com/petitbonney/overly"
edition = "2024"
rust-version = "1.85"
publish = false

[lib]
name = "overly_desktop_lib"
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
