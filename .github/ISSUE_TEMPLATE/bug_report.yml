name: Bug report
description: Something doesn't work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting! Please don't paste tokens, keys or other secrets. Report security issues privately through a security advisory instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Add an Alerts widget
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Overly version
      placeholder: 0.1.0, or a commit hash
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows 11, Windows 10, macOS, Linux, Other]
    validations:
      required: true
  - type: input
    id: obs
    attributes:
      label: Streaming software and version
      placeholder: OBS Studio 31.1
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant log lines. Check that they contain no secrets.
      render: text
